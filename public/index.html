
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e54">
  <title>Mensajería | Honduras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #e9f0eb;
      color: #202c33;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 45px rgba(22, 60, 43, .13);
    }

    .header {
      padding: 30px 24px 26px;
      text-align: center;
      color: #fff;
      background: #075e54;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #128c7e;
    }

    .logo svg {
      width: 42px;
      height: 42px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .header p {
      margin: 9px 0 0;
      color: #d6f2e8;
      font-size: 14px;
      line-height: 1.5;
    }

    .content {
      padding: 28px 24px 30px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #128c7e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 25px;
      color: #667781;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #cbd8d1;
      border-radius: 12px;
      background: #fff;
      transition: border-color .2s;
    }

    .phone:focus-within {
      border-color: #128c7e;
      box-shadow: 0 0 0 3px #128c7e18;
    }

    .prefix {
      padding-right: 12px;
      border-right: 1px solid #dce5df;
      color: #334d42;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    input {
      min-width: 0;
      width: 100%;
      padding: 16px 0;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 17px;
      letter-spacing: 1.5px;
    }

    input::placeholder {
      color: #a3b1aa;
      letter-spacing: 2px;
    }

    .hint {
      margin: 9px 0 20px;
      color: #75847c;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #128c7e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover {
      background: #075e54;
    }

    button:active {
      transform: scale(.99);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #result {
      margin-top: 17px;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      padding: 15px;
      border-top: 1px solid #edf1ee;
      text-align: center;
      color: #829087;
      font-size: 11px;
    }

    @media (max-width: 360px) {
      .content {
        padding: 24px 18px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path
            d="M24 5C13.5 5 5 13 5 23c0 3.6 1.1 7 3.1 9.8L5 43l10.6-2.9A20 20 0 0 0 24 42c10.5 0 19-8.1 19-19S34.5 5 24 5Z"
            stroke="white"
            stroke-width="2.8"
            stroke-linejoin="round"
          />
          <path
            d="M17 15.5c-.7 0-1.8 1-2 2.1-.4 2.2 1.2 5.6 4.5 8.8 3.2 3.1 6.6 4.5 8.8 4.1 1.1-.2 2.5-1.5 2.6-2.5l.2-2.1-5.2-2.4-1.7 2-1.8-1a15 15 0 0 1-3.2-3.3l1-1.7-2.1-5H17Z"
            fill="white"
          />
        </svg>
      </div>

      <h1>Mensajería Honduras</h1>
      <p>Interfaz de mensajería independiente</p>
    </header>

    <section class="content">
      <p class="eyebrow">Honduras · +504</p>
      <h2>Ingresa tu número</h2>
      <p class="description">
        Introduce los ocho dígitos del número de prueba
        para comprobar el funcionamiento del formulario.
      </p>

      <form id="demoForm">
        <label for="number">Número de teléfono</label>

        <div class="phone">
          <span class="prefix">🇭🇳 +504</span>
          <input
            id="number"
            name="number"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="8"
            minlength="8"
            pattern="[0-9]{8}"
            placeholder="00000000"
            aria-describedby="hint"
            required
          >
        </div>

        <p class="hint" id="hint">
          8 dígitos · Formato de Honduras
        </p>

        <button id="sendButton" type="submit">
          Continuar
        </button>
      </form>

      <div id="result" role="status" aria-live="polite"></div>
    </section>

    <footer class="footer">
      Prototipo independiente · No es el servicio oficial de WhatsApp
    </footer>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const input = document.getElementById("number");
    const result = document.getElementById("result");
    const button = document.getElementById("sendButton");

    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 8);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!/^\d{8}$/.test(input.value)) {
        result.textContent = "Introduce exactamente ocho dígitos.";
        return;
      }

      result.textContent =
        "Formulario validado. Para enviar una prueba al servidor, utiliza un número ficticio.";

      // No se envía ni almacena ningún número de teléfono.
    });
  </script>
</body>
</html>
