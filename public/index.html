
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087e4b">
  <title>Demo Mensajería</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #183b2b;
      background: linear-gradient(135deg, #e6f7ed, #f5faf6);
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 32px 25px;
      border: 1px solid #dcebe1;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 55px #17492b12;
      text-align: center;
    }

    .logo {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: #087e4b;
      color: white;
      font-size: 35px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .description {
      color: #64776c;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 27px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d3e2d8;
      border-radius: 12px;
      font-size: 16px;
      outline-color: #087e4b;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #087e4b;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .notice {
      margin-top: 18px;
      color: #64776c;
      font-size: 12px;
      line-height: 1.6;
    }

    #result {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">✉</div>

    <h1>Demo Mensajería</h1>

    <p class="description">
      Práctica educativa para comprobar la conexión
      entre un formulario y un servidor Node.js.
    </p>

    <form id="demoForm">
      <label for="number">Número ficticio de prueba</label>

      <input
        id="number"
        name="number"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        placeholder="0000000000"
        pattern="0000000000"
        maxlength="10"
        required
        aria-describedby="help"
      >

      <p id="help" class="notice">
        Introduce exclusivamente 0000000000.
        No uses números reales.
      </p>

      <button id="sendButton" type="submit">
        Enviar prueba
      </button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="notice">
      Proyecto académico independiente.
      No es un servicio oficial de WhatsApp.
      No solicita contraseñas ni códigos de verificación.
    </p>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const result = document.getElementById("result");
    const button = document.getElementById("sendButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const number = document.getElementById("number").value.trim();

      if (number !== "0000000000") {
        result.textContent = "Usa el número ficticio indicado.";
        return;
      }

      button.disabled = true;
      result.textContent = "Enviando prueba...";

      try {
        const response = await fetch("/api/demo-number", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ number })
        });

        const data = await response.json();
        result.textContent = data.message;

        if (!response.ok) {
          result.textContent = "No se pudo completar la prueba: "
            + data.message;
        }
      } catch (error) {
        result.textContent =
          "No se pudo conectar con el servidor. Inténtalo de nuevo.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
